name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Test
        run: |
          set -o pipefail
          ./build.sh test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build
        run: |
          ./build.sh
          # Whether the app carries App Intents metadata for Shortcuts, and which actions it names.
          if [ -d build/Kinora.app/Contents/Resources/Metadata.appintents ]; then
            ls build/Kinora.app/Contents/Resources/Metadata.appintents
            grep -aoE '(Pause|Resume|Next|SetDesktopMotion)[A-Za-z]*Intent' build/Kinora.app/Contents/Resources/Metadata.appintents/extract.actionsdata | sort -u || true
          else
            echo "App Intents metadata: none"
          fi

      # Generation cost on the CI runner, a virtual Mac. Not representative of a real Mac's
      # GPU or encoder; it shows the pipeline works at full size and roughly what it costs.
      - name: Living Photo benchmark (release)
        env:
          KINORA_BENCH: "1"
        run: swift test -c release -Xswiftc -enable-testing --filter benchmark 2>&1 | grep -E "BENCH|passed|failed|error" || true

      # Last, so the end of the log shows them: what this Mac's AVFoundation opens
      # (ContainerProbeTests), the WebM and MKV conversions (MatroskaConverterTests) and the test totals.
      - name: Summary
        if: always()
        run: grep -E "PROBE|MKV|Test run with|Executed [0-9]+ test" "$RUNNER_TEMP/test.log" || true
